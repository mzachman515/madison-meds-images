<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madison Meds — Image Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1E1B4B;
      --purple: #8B5CF6;
      --purple-light: #A78BFA;
      --purple-subtle: #EDE9FE;
      --gold: #D4A853;
      --surface: #FAFAFA;
      --surface-card: #FFFFFF;
      --text-primary: #1E1B4B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --radius: 12px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--surface);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, #2D2A6E 100%);
      padding: 2rem 1.5rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 24px rgba(30, 27, 75, 0.15);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .header-title {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      color: var(--purple-light);
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 0.15rem;
    }

    /* Search */
    .search-wrap {
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }

    .search-input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input::placeholder { color: rgba(255,255,255,0.5); }
    .search-input:focus {
      border-color: var(--purple-light);
      background: rgba(255,255,255,0.15);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.5);
      pointer-events: none;
    }

    .search-wrap { position: relative; }

    /* Stats bar */
    .stats-bar {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      background: var(--purple-subtle);
      color: var(--navy);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stat-chip .count {
      background: var(--purple);
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
    }

    /* Filter tabs */
    .filter-bar {
      max-width: 1200px;
      margin: 1rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-card);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--purple);
      color: var(--purple);
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    /* Main Grid */
    .gallery {
      max-width: 1200px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    /* Category Heading */
    .category-heading {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--purple-subtle);
    }

    .category-heading:first-child { margin-top: 0; }

    .category-heading h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }

    .category-heading .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      background: var(--purple-subtle);
      color: var(--purple);
      border-radius: 12px;
      font-weight: 600;
    }

    /* Image Card */
    .image-card {
      background: var(--surface-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .image-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(30, 27, 75, 0.1);
    }

    .image-card.hidden { display: none; }

    .card-preview {
      position: relative;
      background: linear-gradient(135deg, #f8f8fc 0%, #f0eef8 100%);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      cursor: pointer;
    }

    .card-preview img {
      max-width: 100%;
      max-height: 180px;
      object-fit: contain;
      transition: transform 0.3s;
    }

    .card-preview:hover img {
      transform: scale(1.08);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(30, 27, 75, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card-preview:hover .card-overlay { opacity: 1; }

    .overlay-text {
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
    }

    .card-info {
      padding: 1rem 1.25rem;
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.25rem;
    }

    .card-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-copy {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--purple);
      border-radius: 6px;
      background: transparent;
      color: var(--purple);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-copy:hover {
      background: var(--purple);
      color: #fff;
    }

    .btn-copy.copied {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .btn-html {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-html:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-html.copied {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    /* URL Preview (shown on click) */
    .url-preview {
      display: none;
      margin-top: 0.75rem;
      padding: 0.6rem 0.75rem;
      background: #F1F5F9;
      border-radius: 6px;
      font-size: 0.65rem;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .url-preview.visible { display: block; }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 27, 75, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-info {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
    }

    .lightbox-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .lightbox-url {
      font-size: 0.75rem;
      color: var(--purple-light);
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-width: 600px;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--navy);
    }

    /* Footer */
    .footer {
      max-width: 1200px;
      margin: 0 auto 2rem;
      padding: 1.5rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 0.7rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .footer code {
      background: var(--purple-subtle);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.65rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header-inner { justify-content: center; text-align: center; }
      .search-wrap { max-width: 100%; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
      .header { padding: 1.25rem 1rem; }
    }

    /* No results animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .image-card { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img class="header-logo" src="./images/logos/logo.jpg" alt="Madison Meds">
        <div>
          <div class="header-title">Madison Meds</div>
          <div class="header-subtitle">Image Library &amp; CDN</div>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search images..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <!-- Populated by JS -->
  </div>

  <!-- Filters -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="weight-loss">Weight Loss</button>
    <button class="filter-btn" data-filter="peptides">Peptides</button>
    <button class="filter-btn" data-filter="hair-wellness">Hair &amp; Wellness</button>
    <button class="filter-btn" data-filter="logos">Logos</button>
    <button class="filter-btn" data-filter="heroes">Heroes</button>
  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery">
    <!-- Populated by JS -->
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <h3>No images match your search</h3>
    <p>Try a different keyword or clear your filter</p>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-info">
      <div class="lightbox-name" id="lightboxName"></div>
      <div class="lightbox-url" id="lightboxUrl"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>
      Copy any URL above and paste directly into GHL email templates as an <code>&lt;img src="..."&gt;</code> tag.<br>
      All images are served over HTTPS with permanent links. Last updated April 2026.
    </p>
  </div>

  <script>
    // Image data — BASE_URL will be replaced after deploy
    const BASE_URL = 'https://mzachman515.github.io/madison-meds-images';

    const images = [
      // Weight Loss
      { name: "Semaglutide", file: "images/weight-loss/semaglutide.png", category: "weight-loss", size: "500x500", format: "PNG", tags: "semaglutide glp-1 weight loss injection vial" },
      { name: "Tirzepatide", file: "images/weight-loss/tirzepatide.png", category: "weight-loss", size: "500x500", format: "PNG", tags: "tirzepatide glp-1 weight loss injection vial" },

      // Peptides
      { name: "GLOW", file: "images/peptides/glow.png", category: "peptides", size: "500x500", format: "PNG", tags: "glow peptide anti-aging skin beauty vial purple blue" },
      { name: "GHK-Cu", file: "images/peptides/ghkcu.png", category: "peptides", size: "500x500", format: "PNG", tags: "ghk-cu ghkcu copper peptide anti-aging skin vial purple blue" },
      { name: "BPC-157", file: "images/peptides/bpc157.png", category: "peptides", size: "500x500", format: "PNG", tags: "bpc-157 bpc157 recovery healing peptide vial" },
      { name: "Wolverine", file: "images/peptides/wolverine.png", category: "peptides", size: "500x500", format: "PNG", tags: "wolverine recovery peptide healing vial" },
      { name: "NAD+", file: "images/peptides/nad.png", category: "peptides", size: "300x300", format: "PNG", tags: "nad+ energy anti-aging cellular health vial" },
      { name: "Glutathione", file: "images/peptides/glutathione.png", category: "peptides", size: "500x500", format: "PNG", tags: "glutathione detox antioxidant skin vial" },
      { name: "Sermorelin", file: "images/peptides/sermorelin.png", category: "peptides", size: "300x300", format: "PNG", tags: "sermorelin growth hormone peptide anti-aging vial" },
      { name: "CJC-1295/Ipamorelin", file: "images/peptides/cjc1295.png", category: "peptides", size: "500x500", format: "PNG", tags: "cjc-1295 ipamorelin growth hormone peptide vial" },

      // Hair & Wellness
      { name: "LushLox", file: "images/hair-wellness/lushlox.png", category: "hair-wellness", size: "255x450", format: "PNG", tags: "lushlox hair growth wellness" },
      { name: "RegrowFuel", file: "images/hair-wellness/regrowfuel.png", category: "hair-wellness", size: "255x450", format: "PNG", tags: "regrowfuel hair regrowth wellness" },

      // Logos
      { name: "Logo (Color)", file: "images/logos/logo.jpg", category: "logos", size: "300x300", format: "JPG", tags: "logo madison meds brand color" },
      { name: "Logo (White)", file: "images/logos/logo-white.png", category: "logos", size: "300x300", format: "PNG", tags: "logo madison meds brand white dark background" },

      // Heroes
      { name: "Weight Loss Hero", file: "images/heroes/weight-loss-hero.jpg", category: "heroes", size: "1200x675", format: "JPG", tags: "hero banner weight loss lifestyle" },
    ];

    const categoryLabels = {
      "weight-loss": "Weight Loss",
      "peptides": "Peptides",
      "hair-wellness": "Hair & Wellness",
      "logos": "Logos",
      "heroes": "Heroes"
    };

    let activeFilter = "all";

    // Render stats
    function renderStats(filtered) {
      const bar = document.getElementById("statsBar");
      const total = filtered.length;
      const cats = {};
      filtered.forEach(img => {
        cats[img.category] = (cats[img.category] || 0) + 1;
      });
      bar.innerHTML = `
        <div class="stat-chip"><span class="count">${total}</span> Total Images</div>
        ${Object.entries(cats).map(([cat, count]) => 
          `<div class="stat-chip"><span class="count">${count}</span> ${categoryLabels[cat]}</div>`
        ).join("")}
      `;
    }

    // Render gallery
    function renderGallery() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const gallery = document.getElementById("gallery");
      
      let filtered = images.filter(img => {
        if (activeFilter !== "all" && img.category !== activeFilter) return false;
        if (query) {
          const searchable = `${img.name} ${img.tags} ${img.category} ${img.format}`.toLowerCase();
          return searchable.includes(query);
        }
        return true;
      });

      renderStats(filtered);

      if (filtered.length === 0) {
        gallery.innerHTML = "";
        document.getElementById("emptyState").style.display = "block";
        return;
      }

      document.getElementById("emptyState").style.display = "none";

      // Group by category
      const grouped = {};
      filtered.forEach(img => {
        if (!grouped[img.category]) grouped[img.category] = [];
        grouped[img.category].push(img);
      });

      const order = ["weight-loss", "peptides", "hair-wellness", "logos", "heroes"];
      let html = "";

      order.forEach(cat => {
        if (!grouped[cat]) return;
        html += `
          <div class="category-heading">
            <h2>${categoryLabels[cat]}</h2>
            <span class="badge">${grouped[cat].length} image${grouped[cat].length > 1 ? "s" : ""}</span>
          </div>
        `;
        grouped[cat].forEach(img => {
          const imgUrl = `${BASE_URL}/${img.file}`;
          html += `
            <div class="image-card" data-category="${img.category}">
              <div class="card-preview" onclick="openLightbox('${img.name}', '${img.file}')">
                <img src="./${img.file}" alt="${img.name}" loading="lazy" width="200">
                <div class="card-overlay"><span class="overlay-text">View Full Size</span></div>
              </div>
              <div class="card-info">
                <div class="card-name">${img.name}</div>
                <div class="card-meta">${img.size} &bull; ${img.format} &bull; ${img.category}</div>
                <div class="card-actions">
                  <button class="btn-copy" onclick="copyUrl('${img.file}', this)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy URL
                  </button>
                  <button class="btn-html" onclick="copyHtml('${img.file}', '${img.name}', this)">
                    &lt;img&gt;
                  </button>
                </div>
                <div class="url-preview" id="url-${img.file.replace(/[/.]/g, '-')}"></div>
              </div>
            </div>
          `;
        });
      });

      gallery.innerHTML = html;
    }

    // Copy URL
    function copyUrl(file, btn) {
      const url = `${BASE_URL}/${file}`;
      navigator.clipboard.writeText(url).then(() => {
        btn.classList.add("copied");
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied`;
        
        // Show URL preview
        const previewId = `url-${file.replace(/[/.]/g, '-')}`;
        const preview = document.getElementById(previewId);
        if (preview) {
          preview.textContent = url;
          preview.classList.add("visible");
        }
        
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy URL`;
        }, 2000);
      });
    }

    // Copy HTML tag
    function copyHtml(file, name, btn) {
      const url = `${BASE_URL}/${file}`;
      const html = `<img src="${url}" alt="${name}" style="max-width:100%;height:auto;">`;
      navigator.clipboard.writeText(html).then(() => {
        btn.classList.add("copied");
        btn.textContent = "Copied";
        
        const previewId = `url-${file.replace(/[/.]/g, '-')}`;
        const preview = document.getElementById(previewId);
        if (preview) {
          preview.textContent = html;
          preview.classList.add("visible");
        }
        
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = "&lt;img&gt;";
        }, 2000);
      });
    }

    // Lightbox
    function openLightbox(name, file) {
      const lb = document.getElementById("lightbox");
      document.getElementById("lightboxImg").src = `./${file}`;
      document.getElementById("lightboxName").textContent = name;
      document.getElementById("lightboxUrl").textContent = `${BASE_URL}/${file}`;
      lb.classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    document.getElementById("lightbox").addEventListener("click", function(e) {
      if (e.target === this) closeLightbox();
    });

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeLightbox();
    });

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        activeFilter = this.dataset.filter;
        renderGallery();
      });
    });

    // Search
    document.getElementById("searchInput").addEventListener("input", renderGallery);

    // Initial render
    renderGallery();
  </script>
</body>
</html>
